# The rules of docs/decisions/0010-one-go-program-over-http.md, 0030-wake-adapters-per-harness.md,
# 0070-delivery-is-a-push-to-a-connected-agent-with-no-inbox.md, and
# 0110-three-binaries-landline-switchboard-and-landline-mcp.md, as data.
# The dependency rules, as data. A checker compares this with a graph that a
# language adapter extracts from the code. Protected like a contract.

components_root: internal
model: internal/model
contracts_root: contracts
# The entry points are not components and may import any of them: cmd/landline-switchboard, cmd/landline-mcp, and
# tui/main.go, which builds landline in its own module, and menubar/main.go, which builds landline-menubar in its own module.
entry_point: cmd

naming:
  component_path: "<noun>/<role>"
  segment_pattern: "^[a-z][a-z0-9]*$"

banned_in_core:
  - filesystem
  - network
  - process
  - terminal
  - clock
  - randomness
  - environment

libraries:
  terminal: []

# Drivers do input and output, so the banned list does not apply to them.
drivers:
  - log/store
  - wake/codex
  - client/http
  - switchboard/server
  - cli/command
  - mcp/server
  - agent/viewer
  - menubar/viewer

# A component may depend only on components at an earlier position, and on
# the model. Two components at one position may not depend on each other.
components:
  - name: agent/registry
    position: 1
    depends_on: []
  - name: message/router
    position: 1
    depends_on: []
  - name: machine/registry
    position: 1
    depends_on: []
  - name: log/store
    position: 2
    depends_on: []
  - name: wake/codex
    position: 2
    depends_on: []
  - name: client/http
    position: 2
    depends_on: []
  - name: switchboard/server
    position: 3
    depends_on: [agent/registry, message/router, machine/registry]
  - name: cli/command
    position: 3
    depends_on: [client/http]
  - name: mcp/server
    position: 3
    depends_on: []
  # The screen packages of the tui/ module, which is its own Go module outside components_root. They reach the switchboard
  # over HTTP and import no root package. Only tui/main.go imports the root module.
  - name: agent/viewer
    position: 3
    depends_on: []
  # The packages of the menubar/ module, which is its own Go module outside components_root, built on macOS only
  # (docs/decisions/0140). It reaches the switchboard over HTTP, runs landline for the server and setup commands, and
  # imports no root package except through its entry point.
  - name: menubar/viewer
    position: 3
    depends_on: []

contracts:
  may_import: [model]
  wiring_test_may_import: own_component

# Scenarios are Go code that start the built binary and drive it from outside.
acceptance:
  scenarios: code
  may_import: [github.com/8thlight-daveloper/landline/testsupport]
